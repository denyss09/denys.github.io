<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite, fadeIn 2s ease-in-out;
      font-family: "Poppins", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      position: relative;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Floating particles background */
    .particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      pointer-events: none;
      animation: float 20s infinite linear;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100px) rotate(360deg);
        opacity: 0;
      }
    }

    .title {
      color: #ffffff;
      margin-bottom: 40px;
      font-weight: 300;
      font-size: 2.5rem;
      text-shadow: 0 4px 8px rgba(0,0,0,0.3);
      text-align: center;
      z-index: 10;
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      animation: titleSlideIn 1.5s ease-out 0.5s forwards;
    }

    @keyframes titleSlideIn {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(-30px);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    .envelope-container {
      position: absolute;
      width: 180px;
      height: 120px;
      perspective: 1200px;
      z-index: 10;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      transition: left 0.3s ease-in-out, top 0.3s ease-in-out, transform 0.3s ease;
      opacity: 0;
      pointer-events: none;
    }

    .envelope-container.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .envelope-container.moving {
      animation: envelopeEntrance 1.8s ease-out 0s both;
    }

    @keyframes envelopeEntrance {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5) rotateY(20deg);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotateY(0deg);
      }
    }

    .envelope-container.caught {
      animation: envelopeCaught 0.8s ease-out forwards !important;
    }

    @keyframes envelopeCaught {
      0% {
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.3) rotate(15deg);
      }
      100% {
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
      }
    }

    .envelope {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #ffffff 0%, #f8f9ff 100%);
      border: 3px solid #e8ecff;
      border-radius: 12px;
      box-shadow: 
        0 20px 40px rgba(0,0,0,0.15),
        0 8px 16px rgba(0,0,0,0.1),
        inset 0 1px 0 rgba(255,255,255,0.8);
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
      overflow: hidden;
      transform-style: preserve-3d;
    }

    .envelope:hover {
      transform: translateY(-8px) scale(1.05);
      box-shadow: 
        0 28px 56px rgba(0,0,0,0.25),
        0 12px 24px rgba(0,0,0,0.18),
        inset 0 1px 0 rgba(255,255,255,0.9),
        0 0 30px rgba(168, 85, 247, 0.4);
      filter: brightness(1.1);
    }

    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.1) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }

    .envelope:hover::before {
      transform: translateX(100%);
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 90px solid transparent;
      border-right: 90px solid transparent;
      border-bottom: 60px solid #a855f7;
      background: linear-gradient(145deg, #a855f7 0%, #d946ef 100%);
      border-radius: 12px 12px 0 0;
      transform-origin: top center;
      transition: all 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
      z-index: 3;
      box-shadow: 0 4px 8px rgba(168, 85, 247, 0.3);
    }

    .heart {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 35px;
      height: 35px;
      background: linear-gradient(145deg, #ef4444 0%, #dc2626 100%);
      clip-path: polygon(50% 0%, 100% 35%, 80% 100%, 50% 80%, 20% 100%, 0% 35%);
      z-index: 4;
      animation: heartPulse 2s infinite ease-in-out;
      transition: all 0.5s ease;
      filter: drop-shadow(0 4px 8px rgba(239, 68, 68, 0.4));
    }

    @keyframes heartPulse {
      0%, 100% { 
        transform: translate(-50%, -50%) scale(1);
        filter: drop-shadow(0 4px 8px rgba(239, 68, 68, 0.4));
      }
      50% { 
        transform: translate(-50%, -50%) scale(1.15);
        filter: drop-shadow(0 6px 12px rgba(239, 68, 68, 0.6));
      }
    }

    .envelope.open .flap {
      transform: rotateX(180deg);
      box-shadow: 0 -4px 8px rgba(168, 85, 247, 0.2);
    }

    .envelope.fade-out {
      transform: scale(0.95);
      opacity: 0;
      filter: blur(2px);
    }

    /* Enhanced message styling */
    .message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      text-align: center;
      font-size: 1.8rem;
      color: #ffffff;
      opacity: 0;
      max-width: 90vw;
      white-space: normal;
      font-weight: 400;
      line-height: 1.4;
      transition: all 1s cubic-bezier(0.25, 0.1, 0.25, 1);
      text-shadow: 0 4px 8px rgba(0,0,0,0.3);
      padding: 30px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }

    .message.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      animation: messagePopIn 1.2s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    @keyframes messagePopIn {
      0% { 
        transform: translate(-50%, -50%) scale(0.3) rotateY(90deg);
        opacity: 0;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.05) rotateY(0deg);
        opacity: 1;
      }
      100% { 
        transform: translate(-50%, -50%) scale(1) rotateY(0deg);
        opacity: 1;
      }
    }

    /* Typing animation for message text */
    .message-text {
      overflow: hidden;
      border-right: 2px solid #ffffff;
      white-space: nowrap;
      margin: 0 auto;
      animation: typing 3s steps(40, end), blink-caret 0.75s step-end infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blink-caret {
      from, to { border-color: transparent; }
      50% { border-color: #ffffff; }
    }

    .footer {
      position: absolute;
      bottom: 30px;
      color: #ffffff;
      font-size: 1.3rem;
      font-weight: 300;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      z-index: 10;
      opacity: 0;
      animation: footerSlideUp 1.5s ease-out 2s forwards;
    }

    @keyframes footerSlideUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Floating hearts animation */
    .floating-heart {
      position: absolute;
      color: #ff6b9d;
      font-size: 1.5rem;
      pointer-events: none;
      animation: floatHeart 4s ease-out forwards;
      z-index: 5;
    }

    @keyframes floatHeart {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-100px) scale(0.3);
      }
    }

    /* Challenge screen styling */
    .challenge-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 20;
      opacity: 1;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .challenge-screen.hidden {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.8);
      pointer-events: none;
    }

    .challenge-question {
      font-size: 2.2rem;
      color: #ffffff;
      font-weight: 400;
      margin-bottom: 40px;
      text-shadow: 0 4px 8px rgba(0,0,0,0.3);
      animation: fadeInScale 1s ease-out;
    }

    @keyframes fadeInScale {
      0% {
        opacity: 0;
        transform: scale(0.9);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .challenge-buttons {
      display: flex;
      gap: 30px;
      justify-content: center;
      animation: fadeInScale 1s ease-out 0.3s both;
    }

    .challenge-button {
      background: linear-gradient(145deg, #ffffff 0%, #f8f9ff 100%);
      border: 3px solid #e8ecff;
      padding: 20px 50px;
      font-size: 1.5rem;
      font-weight: 500;
      color: #764ba2;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
      box-shadow: 
        0 10px 30px rgba(0,0,0,0.15),
        0 4px 8px rgba(0,0,0,0.1);
      font-family: "Poppins", sans-serif;
    }

    .challenge-button:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 
        0 15px 40px rgba(0,0,0,0.2),
        0 8px 16px rgba(0,0,0,0.15),
        0 0 30px rgba(168, 85, 247, 0.4);
      background: linear-gradient(145deg, #ffffff 0%, #f0f2ff 100%);
    }

    .challenge-button:active {
      transform: translateY(-2px) scale(1.02);
    }
  </style>
</head>
<body>
  <div class="particles"></div>
  
  <!-- Challenge Screen -->
  <div class="challenge-screen" id="challengeScreen">
    <div class="challenge-question">
      Aceitas um desafio? 🤍
    </div>
    <div class="challenge-buttons">
      <button class="challenge-button" onclick="startChallenge()">Sim</button>
      <button class="challenge-button" onclick="startChallenge()">Sim</button>
    </div>
  </div>
  
  <div class="envelope-container" id="envelopeContainer">
    <div class="envelope" id="envelope">
      <div class="flap"></div>
      <div class="heart"></div>
    </div>
    <div class="message" id="message">
      <div class="message-text"></div>
    </div>
  </div>

  <footer class="footer">Com carinho, Denys 🤍</footer>

<script>
  // Create floating particles
  function createParticles() {
    const particlesContainer = document.querySelector('.particles');
    
    for (let i = 0; i < 50; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      
      // Random size between 2px and 8px
      const size = Math.random() * 6 + 2;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      
      // Random horizontal position
      particle.style.left = Math.random() * 100 + '%';
      
      // Random animation delay
      particle.style.animationDelay = Math.random() * 20 + 's';
      
      // Random animation duration
      particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
      
      particlesContainer.appendChild(particle);
    }
  }

  // Create floating hearts effect
  function createFloatingHeart(x, y) {
    const heart = document.createElement('div');
    heart.className = 'floating-heart';
    heart.innerHTML = '🤍';
    heart.style.left = x + 'px';
    heart.style.top = y + 'px';
    
    document.body.appendChild(heart);
    
    setTimeout(() => {
      heart.remove();
    }, 4000);
  }

  // Typing effect for message
  function typeMessage(element, text, speed = 50) {
    element.innerHTML = '';
    element.style.borderRight = '2px solid #ffffff';
    let i = 0;
    
    function type() {
      if (i < text.length) {
        element.innerHTML += text.charAt(i);
        i++;
        setTimeout(type, speed);
      } else {
        // Remove cursor after typing is complete
        setTimeout(() => {
          element.style.borderRight = 'none';
        }, 1000);
      }
    }
    
    type();
  }

const mensagens = [
  "bom dia fofinha! Acordei a pensar em ti outra vez… espero que o teu dia seja incrível hoje",
  "princesa acredita em ti! És capaz de muito mais do que imaginas. Eu acredito sempre.",
  "fofinha sei que às vezes temos dias difíceis, mas tu és mais forte!",
  "mesmo longe, tu consegues melhorar o meu dia só por existires.",
  "a tua forma de ser inspira-me princesa. És linda por fora, mas ainda mais por dentro.",
  "fofinha não te esqueças de sorrir hoje! o teu sorriso muda tudo.",
  "amo-te. Simples assim. Hoje, amanhã e sempre.",
  "princesa hoje vai correr bem. Um passo de cada vez, e eu estou a torcer por ti como sempre.",
  "fofinha tenho tanto orgulho em ti. por seres quem és.",
  "és o meu conforto, a minha calma e o meu caos preferido.",
  "princesa espero que o teu dia te abrace como eu queria abraçar-te agora.",
  "fofinha, só quero lembrar-te que és incrível, mesmo nos dias em que duvidas disso.",
  "gosto tanto de ti. E o gosto só cresce a cada dia 🤍",
  "amo-te tanto fofinha 🤍 ",
  "fofinha não deixes que nada te roube a paz hoje. Respira, sorri, e vai com calma.",
  "hoje vai correr tudo bem fofinha 🤍",
  "espero que saibas o quanto és especial para mim 🤍",
  "espero que saibas o quanto és especial para mim 🤍",
  "tu mereces tudo o que há de bonito neste mundo, e eu quero ajudar-te a alcançar cada pedacinho.",
  "amo-te tanto fofinha 🤍",
  "és maravilhosa, lindissima e incrível. Nunca te esqueças disso 🤍",
  "O meu dia fica sempre melhor quando estou ou falo contigo. sempre.",
  "princesa espero que o teu dia te abrace como eu queria abraçar-te agora",
  "princesa espero que o teu dia te abrace como eu queria abraçar-te agora",
  "és a melhor parte dos meus dias 🤍",
  "o mundo é mais bonito porque tu estás nele 🤍",
  "amo-te. Simples assim. Hoje, amanhã e sempre",
  "amo-te. Simples assim. Hoje, amanhã e sempre",
  "amo-te. Simples assim. Hoje, amanhã e sempre",
  "amo-te. Simples assim. Hoje, amanhã e sempre."
];


  const envelope = document.getElementById("envelope");
  const envelopeContainer = document.querySelector(".envelope-container");
  const messageBox = document.getElementById("message");
  const challengeScreen = document.getElementById("challengeScreen");
  let isOpened = false;
  let moveInterval;
  let challengeStarted = false;

  // Initialize particles
  createParticles();

  // Function to start the challenge
  window.startChallenge = function() {
    if (challengeStarted) return;
    challengeStarted = true;

    // Hide challenge screen
    challengeScreen.classList.add('hidden');

    // Show envelope at random corner position after a short delay
    setTimeout(() => {
      // Choose a random corner (0: top-left, 1: top-right, 2: bottom-left, 3: bottom-right)
      const corner = Math.floor(Math.random() * 4);
      const margin = 150;
      
      let startLeft, startTop;
      
      switch(corner) {
        case 0: // Top-left
          startLeft = margin;
          startTop = margin + 50;
          break;
        case 1: // Top-right
          startLeft = window.innerWidth - margin;
          startTop = margin + 50;
          break;
        case 2: // Bottom-left
          startLeft = margin;
          startTop = window.innerHeight - margin;
          break;
        case 3: // Bottom-right
          startLeft = window.innerWidth - margin;
          startTop = window.innerHeight - margin;
          break;
      }
      
      // Set initial corner position
      envelopeContainer.style.left = startLeft + 'px';
      envelopeContainer.style.top = startTop + 'px';
      envelopeContainer.classList.add('visible');
      
      setTimeout(() => {
        envelopeContainer.classList.add('moving');
        
        // Start moving to random positions after appearing
        setTimeout(() => {
          moveEnvelopeRandomly();
          
          // Continue moving every 0.5 seconds (ultra fast!)
          moveInterval = setInterval(() => {
            moveEnvelopeRandomly();
          }, 500);
        }, 800);
      }, 500);
    }, 500);
  };

  // Function to move envelope to random position
  function moveEnvelopeRandomly() {
    if (isOpened) return;
    
    // Calculate safe boundaries (accounting for envelope size and margins)
    const margin = 100; // pixels from edge
    const minLeft = margin;
    const maxLeft = window.innerWidth - margin;
    const minTop = 150; // Below title
    const maxTop = window.innerHeight - 150; // Above footer
    
    // Generate random position
    const randomLeft = Math.random() * (maxLeft - minLeft) + minLeft;
    const randomTop = Math.random() * (maxTop - minTop) + minTop;
    
    // Apply new position
    envelopeContainer.style.left = randomLeft + 'px';
    envelopeContainer.style.top = randomTop + 'px';
    
    // Add slight rotation for dynamic effect
    const randomRotation = (Math.random() - 0.5) * 15;
    envelopeContainer.style.transform = `translate(-50%, -50%) rotate(${randomRotation}deg)`;
  }

  // Enhanced envelope click handler
  envelope.addEventListener("click", (e) => {
    if (isOpened) return;
    isOpened = true;

    // Stop the movement
    clearInterval(moveInterval);
    envelopeContainer.classList.add("caught");
    envelopeContainer.style.transition = 'none';

    // Move envelope to center for the reveal
    envelopeContainer.style.left = '50%';
    envelopeContainer.style.top = '50%';
    envelopeContainer.style.transform = 'translate(-50%, -50%)';

    // Create floating hearts at click position
    const rect = envelope.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    for (let i = 0; i < 8; i++) {
      setTimeout(() => {
        createFloatingHeart(
          rect.left + x + (Math.random() - 0.5) * 100,
          rect.top + y + (Math.random() - 0.5) * 100
        );
      }, i * 150);
    }

    envelope.classList.add("open");

    setTimeout(() => {
      envelope.classList.add("fade-out");
    }, 800);

    const data = new Date();
    let dia = data.getDate();
    if (dia > 30) dia = 30;
    const mensagem = mensagens[dia - 1];

    setTimeout(() => {
      messageBox.classList.add("visible");
      
      setTimeout(() => {
        const messageText = messageBox.querySelector('.message-text');
        typeMessage(messageText, mensagem, 30);
      }, 600);
    }, 1200);
  });

  // Add hover effect for envelope
  envelope.addEventListener("mouseenter", () => {
    if (!isOpened) {
      envelope.style.transform = "translateY(-8px) scale(1.05)";
    }
  });

  envelope.addEventListener("mouseleave", () => {
    if (!isOpened) {
      envelope.style.transform = "translateY(0) scale(1)";
    }
  });

  // Add click effect to create hearts randomly
  document.addEventListener('click', (e) => {
    if (e.target !== envelope && !envelope.contains(e.target)) {
      createFloatingHeart(e.clientX, e.clientY);
    }
  });
</script>
</body>
</html>
